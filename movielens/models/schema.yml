version: 3


unit_tests:
  - name: test_movies_source_passthrough
    description: "Unit test validating the bronze movies logic produces expected records from mock source data."
    model: movies
    given:
      - input: source('raw_data', 'raw_movies')
        rows:
          - {movieid: 1, title: 'Toy Story (1995)', genres: 'Adventure|Animation|Children|Comedy|Fantasy'}
          - {movieid: 2, title: 'Jumanji (1995)', genres: 'Adventure|Children|Fantasy'}
    expect:
      rows:
        - {movieid: 1, title: 'Toy Story (1995)', genres: 'Adventure|Animation|Children|Comedy|Fantasy'}
        - {movieid: 2, title: 'Jumanji (1995)', genres: 'Adventure|Children|Fantasy'}
