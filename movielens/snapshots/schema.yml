version: 2

snapshots:
  - name: movies_snapshot
    description: >
      SCD Type 2 snapshot of the bronze movies model.
      Tracks changes to title and genres over time using the check strategy.
      Each row represents a historical version of a movie record.
    columns:
      - name: movie_id
        description: Unique identifier for each movie (natural key).
        tests:
          - not_null
      - name: title
        description: Title of the movie, typically including the release year in parentheses.
      - name: genres
        description: Pipe-delimited list of genres associated with the movie.
      - name: _loaded_at
        description: Timestamp indicating when the record was loaded from the stage file.
      - name: dbt_scd_id
        description: Surrogate key uniquely identifying each SCD2 version row.
        tests:
          - not_null
          - unique
      - name: dbt_updated_at
        description: Timestamp of when this snapshot row was last updated by dbt.
        tests:
          - not_null
      - name: dbt_valid_from
        description: Timestamp marking the start of this version's validity window.
        tests:
          - not_null
      - name: dbt_valid_to
        description: >
          Timestamp marking the end of this version's validity window.
          NULL indicates this is the currently active version.
